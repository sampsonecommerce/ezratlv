<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>לוח אירועים | עזרא</title>
  <!-- The open-events page moved from /events to /open-events (2026-08-30). GitHub Pages
       cannot issue a server-side redirect, so this stub is what stays behind at the old
       URL: canonical + meta refresh for crawlers, location.replace for people, hash and
       query preserved for deep links like /events#schedule. -->
  <link rel="canonical" href="https://ezratlv.com/open-events" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="0; url=/open-events" />
  <script>location.replace("/open-events" + location.search + location.hash);</script>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 3rem;">
    הדף עבר לכתובת חדשה: <a href="/open-events">ezratlv.com/open-events</a>
  </p>
</body>
</html>
